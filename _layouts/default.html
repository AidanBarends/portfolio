<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="theme-color" content="#0B0F14">
  <!-- Fonts: Inter for text, JetBrains Mono for the terminal-style labels -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <!-- Apply the saved theme before the page paints, so there is no flash -->
  <script>
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="nav">
    <div class="nav__inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand__mark">AB</span>
        <span class="brand__name">Aidan Barends</span>
      </a>
      <nav class="nav__links" aria-label="Main">
        <!-- 'is-active' highlights the page you are on -->
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="is-active"{% endif %}>Home</a>
        <a href="{{ '/agile.html' | relative_url }}" {% if page.url == '/agile.html' %}class="is-active"{% endif %}>Agile e-Portfolio</a>
        <a href="https://aidan-barends.vercel.app/">Main site</a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="Toggle light / dark theme">
        <!-- Half-filled circle icon, drawn in SVG so it looks the same on every device -->
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <main id="main" class="page">
    {{ content }}
  </main>

  <footer class="footer">
    <p><span class="prompt">~/aidan $</span> built with Markdown, Jekyll and GitHub Pages</p>
  </footer>

  <script>
    // Theme toggle: flips data-theme on <html> and remembers the choice
    document.querySelector('.theme-toggle').addEventListener('click', function () {
      var root = document.documentElement;
      var dark = root.getAttribute('data-theme') !== 'light';
      var next = dark ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    });
    // If a screenshot is missing, hide its block instead of showing a broken image icon
    document.querySelectorAll('main img').forEach(function (img) {
      img.addEventListener('error', function () {
        var box = img.closest('.shot') || img.parentElement;
        box.style.display = 'none';
      });
    });
    // Open every external link in a new tab so the lecturer never loses the portfolio
    document.querySelectorAll('main a[href^="http"]').forEach(function (a) {
      a.target = '_blank'; a.rel = 'noopener';
    });
  </script>
</body>
</html>
