# Site settings for GitHub Pages (Jekyll)
title: Aidan Barends
description: Digital portfolio of Aidan Barends, Application Development student at CPUT.
author: Aidan Barends
baseurl: "/portfolio"
url: "https://aidanbarends.github.io"

# Kramdown with GitHub-flavoured Markdown, same as GitHub Pages default
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# Every page uses _layouts/default.html unless it says otherwise
defaults:
  - scope:
      path: ""
    values:
      layout: default

# index.md is the homepage now, so the README stays a GitHub-only file.
# The video is embedded from YouTube, so the big local copy is not needed on the site.
exclude:
  - README.md
  - "Video interview (2).mp4"
